<template>
  <template lwc:if={isLoading}>
    <div class="spinner-container">
      <lightning-spinner alternative-text="Loading" size="medium">
      </lightning-spinner>
    </div>
  </template>

  <iframe
    name="externalContentFrame"
    src={endpointURL}
    height="600px"
    width="100%"
    frameborder="0"
    onload={handleiFrameLoad}
  ></iframe>

  <form
    action={endpointURL}
    method={method}
    class="slds-hidden"
    target="externalContentFrame"
  >
    <input class="slds-hidden" name="query" value={outboundData} />
  </form>
</template>
