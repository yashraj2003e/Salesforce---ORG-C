<template>
    <h1>Please enter username:</h1>
    <input type="text" onkeyup={handleUsernameChange}></input>
    <button onclick={handleSubmit}>Submit</button> 
    <div if:true={isSuccess}>
        <h3>Password Has been successfully reset, redirecting to login page !</h3>
    </div>
    <div if:true={isFailed}>
        <h3>An error has occurred !</h3>
    </div>
</template>
